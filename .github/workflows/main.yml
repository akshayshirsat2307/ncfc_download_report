name: Download NCFC daily report

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Ensure requests is available
        run: python -m pip install --upgrade pip requests

      - name: Run downloader script (creates downloads next to script)
        shell: bash
        run: |
          set -euo pipefail
          # run the script located at repo root; pass a relative --to so it is created next to the script
          python ncfc_download_report_code.py --to downloads || true
          # show what's in the repo-root downloads folder for debugging
          ls -la "${{ github.workspace }}/downloads" || true

      - name: Upload downloaded PDF and debug HTML (if present)
        uses: actions/upload-artifact@v4
        with:
          name: ncfc-report
          path: |
            downloads/*.pdf
            downloads/download_error.debug.html
