name: Download NCFC daily report

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Ensure requests is available
        run: python -m pip install --upgrade pip requests

      - name: Run downloader script
        shell: bash
        run: |
          set -euo pipefail
          # Run the downloader script - PDF will be saved in the same directory as the script
          echo "GITHUB_WORKSPACE: ${{ github.workspace }}"
          echo "Current directory: $(pwd)"
          python ncfc_download_report_code.py || true
          # Show downloaded files in the repository root
          echo "=== Checking for downloaded PDF ==="
          ls -la *.pdf || echo "No PDF files found"
          ls -la *.debug.html || echo "No debug HTML files found"

      - name: Upload downloaded PDF and debug HTML (if present)
        uses: actions/upload-artifact@v4
        with:
          name: ncfc-report
          path: |
            *.pdf
            *.debug.html
