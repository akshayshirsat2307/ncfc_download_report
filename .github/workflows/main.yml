name: Download NCFC daily report

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Ensure requests is available
        run: python -m pip install --upgrade pip requests

      - name: Run downloader (python) with curl fallback
        run: |
          set -euo pipefail
          mkdir -p downloads
          # try python downloader; if it fails, try curl with browser UA & Referer
          if python ncfc_download_report_code.py --to downloads; then
            echo "Downloaded via python script"
          else
            echo "Python downloader failed; trying curl fallback"
            OUT="downloads/LatestAgriculturalCondAsses_$(date +%F).pdf"
            curl -fL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.0.0 Safari/537.36" \
                 -e "https://www.ncfc.gov.in/" \
                 "https://www.ncfc.gov.in/downloads/LatestAgriculturalCondAsses.pdf" -o "$OUT"
            ls -lh "$OUT" || true
          fi

      - name: Upload downloaded PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncfc-report
          path: downloads/*.pdf
