name: Download NCFC PDF Daily

# Only run on a daily schedule or manually (prevents push loops if you commit files)
on:
  schedule:
    - cron: '0 0 * * *'   # daily at 00:00 UTC
  workflow_dispatch:      # manual run from Actions tab

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --upgrade pip requests

      - name: Run download script
        run: python scripts/download_pdf.py --out downloads

      - name: Upload downloaded PDF(s) as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncfc-pdfs
          path: downloads/*.pdf
