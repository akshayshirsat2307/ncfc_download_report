name: Download NCFC daily report

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Ensure requests is available
        run: python -m pip install --upgrade pip requests

      - name: Run downloader script
        shell: bash
        run: |
          set -euo pipefail
          # Use absolute path to ensure downloads folder is created in the workspace root
          echo "GITHUB_WORKSPACE: ${{ github.workspace }}"
          echo "Current directory: $(pwd)"
          python ncfc_download_report_code.py --to "/downloads" || true
          # Show what's in the downloads folder
          echo "=== Checking downloads folder ==="
          ls -la "${{ github.workspace }}/downloads" || echo "Downloads folder not found"

      - name: Upload downloaded PDF and debug HTML (if present)
        uses: actions/upload-artifact@v4
        with:
          name: ncfc-report
          path: |
            ${{ github.workspace }}/downloads/*.pdf
            ${{ github.workspace }}/downloads/download_error.debug.html
